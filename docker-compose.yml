services:
  db:
    image: postgres:16-alpine
    container_name: tennis-search-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tennis_search
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
    ports:
      - "5432:5432"
    volumes:
      - tennis_search_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tennis-search-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - tennis_search_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tennis_search_data:
  tennis_search_redis_data:
